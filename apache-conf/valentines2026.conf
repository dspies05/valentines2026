<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    ServerName sonneundmond.duckdns.org
    ServerAlias www.sonneundmond.duckdns.org
    DocumentRoot /var/www/valentines2026

    ErrorLog ${APACHE_LOG_DIR}/valentines2026-error.log
    CustomLog ${APACHE_LOG_DIR}/valentines2026-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>

<Directory /var/www/valentines2026>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
</Directory>